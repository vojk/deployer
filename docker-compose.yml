services:
  gateway:
    build:
      context: ./web-server
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - DEPLOY_DB_PATH=/data/deploy.db
      - WORKER_SOCKET=/run/deployer/deployer.sock
    volumes:
      - /run/deployer:/run/deployer
      - gateway_data:/data
    restart: unless-stopped

volumes:
  gateway_data:
