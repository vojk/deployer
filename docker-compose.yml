services:
  gateway:
    build:
      context: ./web-server
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - DEPLOY_TOKEN=${DEPLOY_TOKEN:?Set DEPLOY_TOKEN in .env}
      - WORKER_SOCKET=/run/deployer/deployer.sock
    volumes:
      - deployer-sock:/run/deployer
    restart: unless-stopped

volumes:
  deployer-sock:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /run/deployer
