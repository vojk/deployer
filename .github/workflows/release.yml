name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (must start with v, for example v1.4.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build C++ worker
        working-directory: includes
        run: |
          cmake -S . -B build
          cmake --build build -j"$(nproc)"

      - name: Generate release metadata
        id: metadata
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME}"
          fi

          if ! echo "${version}" | grep -Eq '^v[0-9]+(\.[0-9]+){2}([.-][0-9A-Za-z.-]+)?$'; then
            echo "Invalid version '${version}'. Expected vX.Y.Z (optional suffix allowed)." >&2
            exit 1
          fi

          safe_version="$(echo "${version}" | sed -E 's/[^a-zA-Z0-9._-]+/-/g')"
          tag="${version}"
          release_name="Release ${version}"
          release_dir="deploy-release-${safe_version}"
          tar_name="${release_dir}.tar.gz"
          zip_name="${release_dir}.zip"

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "release_name=${release_name}" >> "${GITHUB_OUTPUT}"
          echo "release_dir=${release_dir}" >> "${GITHUB_OUTPUT}"
          echo "tar_name=${tar_name}" >> "${GITHUB_OUTPUT}"
          echo "zip_name=${zip_name}" >> "${GITHUB_OUTPUT}"

      - name: Create release notes
        id: notes
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          TAR_NAME: ${{ steps.metadata.outputs.tar_name }}
          ZIP_NAME: ${{ steps.metadata.outputs.zip_name }}
        run: |
          previous_tag="$(git tag --sort=-creatordate | grep -E '^v' | grep -Fxv "${VERSION}" | head -n 1 || true)"
          if [ -n "${previous_tag}" ]; then
            range="${previous_tag}..HEAD"
          else
            range="HEAD"
          fi

          all_commits="$(git log --pretty='- %s (%h)' ${range} || true)"
          if [ -z "${all_commits}" ]; then
            all_commits="- No notable changes found in commit history."
          fi

          breaking_commits="$(git log --pretty='- %s (%h)' ${range} | grep -Ei '(^- .*!:)|breaking(\s|-)?change|incompatible' || true)"
          if [ -z "${breaking_commits}" ]; then
            breaking_commits="- No breaking changes detected."
          fi

          upgrade_commits="$(git log --pretty='- %s (%h)' ${range} | grep -Ei 'upgrade|migration|migrate|deprecat|rollout' || true)"
          if [ -z "${upgrade_commits}" ]; then
            upgrade_commits="- No upgrade-specific steps detected."
          fi

          cat <<EOF > release-notes.md
          # Release ${VERSION}

          ## Highlights
          ${all_commits}

          ## Breaking changes
          ${breaking_commits}

          ## Upgrade notes
          ${upgrade_commits}

          ## Checksums
          - Verify artifacts with \`sha256sum -c SHA256SUMS.txt\`.
          - Included artifacts: \`${TAR_NAME}\`, \`${ZIP_NAME}\`.
          EOF
          echo "body_path=release-notes.md" >> "${GITHUB_OUTPUT}"

      - name: Validate release input paths
        run: |
          required_paths=(
            "web-server"
            "example_workflow"
            ".dockerignore"
            "deployer@.service"
            "docker-compose.yml"
            "LICENSE"
            "README.md"
            "RELEASE_README.md"
            "server-flow.yml"
            "includes/build/deployer"
          )

          for path in "${required_paths[@]}"; do
            if [ ! -e "${path}" ]; then
              echo "Missing required path: ${path}" >&2
              exit 1
            fi
          done

      - name: Build release archives
        id: bundle
        env:
          RELEASE_DIR: ${{ steps.metadata.outputs.release_dir }}
          TAR_NAME: ${{ steps.metadata.outputs.tar_name }}
          ZIP_NAME: ${{ steps.metadata.outputs.zip_name }}
        run: |
          mkdir -p "release_bundle/${RELEASE_DIR}"

          cp -a web-server "release_bundle/${RELEASE_DIR}/"
          cp -a example_workflow "release_bundle/${RELEASE_DIR}/"
          cp -a .dockerignore "release_bundle/${RELEASE_DIR}/"
          cp -a deployer@.service "release_bundle/${RELEASE_DIR}/"
          cp -a docker-compose.yml "release_bundle/${RELEASE_DIR}/"
          cp -a LICENSE "release_bundle/${RELEASE_DIR}/"
          cp -a README.md "release_bundle/${RELEASE_DIR}/"
          cp -a RELEASE_README.md "release_bundle/${RELEASE_DIR}/"
          cp -a server-flow.yml "release_bundle/${RELEASE_DIR}/"
          install -m 0755 includes/build/deployer "release_bundle/${RELEASE_DIR}/deployer"

          tar -czf "${TAR_NAME}" -C release_bundle "${RELEASE_DIR}"
          (
            cd release_bundle
            zip -r "../${ZIP_NAME}" "${RELEASE_DIR}"
          )
          sha256sum "${TAR_NAME}" "${ZIP_NAME}" > SHA256SUMS.txt

          echo "tar_path=${TAR_NAME}" >> "${GITHUB_OUTPUT}"
          echo "zip_path=${ZIP_NAME}" >> "${GITHUB_OUTPUT}"
          echo "checksums_path=SHA256SUMS.txt" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          name: ${{ steps.metadata.outputs.release_name }}
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: true
          files: |
            ${{ steps.bundle.outputs.tar_path }}
            ${{ steps.bundle.outputs.zip_path }}
            ${{ steps.bundle.outputs.checksums_path }}
